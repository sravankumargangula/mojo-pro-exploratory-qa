name: MOJO Pro — Playwright QA Suite

# ──────────────────────────────────────────────────────────────
# Triggers
# ──────────────────────────────────────────────────────────────
on:
  # Run on every push to main / develop
  push:
    branches: [main, master, develop]

  # Run on every pull request targeting main / develop
  pull_request:
    branches: [main, master, develop]

  # Nightly regression at 02:00 UTC (07:30 IST) Monday–Friday
  schedule:
    - cron: '0 2 * * 1-5'

  # Allow manual trigger from GitHub Actions UI with optional suite selection
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run (leave blank for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - tests/auth/
          - tests/overview/
          - tests/navigation/
          - tests/seed.spec.ts
      headed:
        description: 'Run in headed mode (only works on self-hosted runners)'
        required: false
        default: false
        type: boolean

# ──────────────────────────────────────────────────────────────
# Concurrency — cancel in-flight runs on the same branch/PR
# ──────────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Main test job
  # ────────────────────────────────────────────────────────────
  playwright-tests:
    name: Playwright Tests — ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: 'Auth',       path: 'tests/auth/' }
          - { name: 'Overview',   path: 'tests/overview/' }
          - { name: 'Navigation', path: 'tests/navigation/' }
          - { name: 'Seed',       path: 'tests/seed.spec.ts' }

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Java (required by Allure CLI) ───────────────────
      - name: Set up Java 21 for Allure
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 4. Install npm dependencies ────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Install Playwright browsers ─────────────────────
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ── 6. Run tests for this shard ────────────────────────
      - name: Run — ${{ matrix.shard.name }} suite
        run: |
          SUITE="${{ github.event.inputs.suite || matrix.shard.path }}"
          npx playwright test $SUITE --workers=1 --retries=2
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          CI: true

      # ── 7. Upload raw Allure results per shard ─────────────
      - name: Upload Allure results — ${{ matrix.shard.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard.name }}
          path: allure-results/
          retention-days: 30

      # ── 8. Upload Playwright traces / videos on failure ────
      - name: Upload test artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artefacts-${{ matrix.shard.name }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Merge all shard results → single Allure report
  # ────────────────────────────────────────────────────────────
  allure-report:
    name: Generate & Publish Allure Report
    needs: playwright-tests
    runs-on: ubuntu-latest
    if: always()

    permissions:
      contents: write       # needed to push to gh-pages
      pull-requests: write  # needed to comment on PRs

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 3. Node (for allure-commandline) ───────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install allure-commandline
        run: npm ci

      # ── 4. Download all shard results ──────────────────────
      - name: Download Allure results — Auth
        uses: actions/download-artifact@v4
        with:
          name: allure-results-Auth
          path: allure-results/
        continue-on-error: true

      - name: Download Allure results — Overview
        uses: actions/download-artifact@v4
        with:
          name: allure-results-Overview
          path: allure-results/
        continue-on-error: true

      - name: Download Allure results — Navigation
        uses: actions/download-artifact@v4
        with:
          name: allure-results-Navigation
          path: allure-results/
        continue-on-error: true

      - name: Download Allure results — Seed
        uses: actions/download-artifact@v4
        with:
          name: allure-results-Seed
          path: allure-results/
        continue-on-error: true

      # ── 5. Restore Allure history from gh-pages ────────────
      - name: Restore Allure history
        run: |
          if git ls-remote --exit-code origin gh-pages; then
            git fetch origin gh-pages
            mkdir -p allure-results/history
            git show origin/gh-pages:history 2>/dev/null | tar -x -C allure-results/history || true
          fi
        continue-on-error: true

      # ── 6. Generate Allure HTML report ─────────────────────
      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      # ── 7. Upload report as workflow artefact ──────────────
      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ── 8. Publish to GitHub Pages ─────────────────────────
      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: allure-report
          keep_files: false

      # ── 9. Parse results for PR / job summary ──────────────
      - name: Parse test results summary
        id: summary
        run: |
          PASSED=$(find allure-results -name '*-result.json' | xargs grep -l '"status":"passed"' 2>/dev/null | wc -l | tr -d ' ')
          FAILED=$(find allure-results -name '*-result.json' | xargs grep -l '"status":"failed"' 2>/dev/null | wc -l | tr -d ' ')
          BROKEN=$(find allure-results -name '*-result.json' | xargs grep -l '"status":"broken"' 2>/dev/null | wc -l | tr -d ' ')
          SKIPPED=$(find allure-results -name '*-result.json' | xargs grep -l '"status":"skipped"' 2>/dev/null | wc -l | tr -d ' ')
          TOTAL=$((PASSED + FAILED + BROKEN + SKIPPED))
          echo "passed=$PASSED"   >> $GITHUB_OUTPUT
          echo "failed=$FAILED"   >> $GITHUB_OUTPUT
          echo "broken=$BROKEN"   >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL"     >> $GITHUB_OUTPUT

      # ── 10. Write GitHub Actions Job Summary ───────────────
      - name: Write job summary
        run: |
          PASSED=${{ steps.summary.outputs.passed }}
          FAILED=${{ steps.summary.outputs.failed }}
          BROKEN=${{ steps.summary.outputs.broken }}
          TOTAL=${{ steps.summary.outputs.total }}
          STATUS=$([[ "$FAILED" -eq 0 && "$BROKEN" -eq 0 ]] && echo "✅ All tests passed" || echo "❌ Some tests failed")

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## MOJO Pro QA — Test Results $STATUS

          | Result  | Count |
          |---------|-------|
          | ✅ Passed  | $PASSED |
          | ❌ Failed  | $FAILED |
          | 🔴 Broken  | $BROKEN |
          | ⏭️ Skipped | ${{ steps.summary.outputs.skipped }} |
          | **Total**  | **$TOTAL** |

          ### Details
          - **Trigger:** \`${{ github.event_name }}\`
          - **Branch:** \`${{ github.ref_name }}\`
          - **Run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Allure Report:** Download from the *Artifacts* section above
          - **JIRA Ticket:** [QA-3303](https://joveojira.atlassian.net/browse/QA-3303)
          EOF

      # ── 11. Comment on Pull Request ────────────────────────
      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed  = '${{ steps.summary.outputs.passed }}';
            const failed  = '${{ steps.summary.outputs.failed }}';
            const broken  = '${{ steps.summary.outputs.broken }}';
            const skipped = '${{ steps.summary.outputs.skipped }}';
            const total   = '${{ steps.summary.outputs.total }}';
            const ok      = failed === '0' && broken === '0';
            const icon    = ok ? '✅' : '❌';

            const body = `## ${icon} MOJO Pro QA — Playwright Results

            | Result | Count |
            |--------|-------|
            | ✅ Passed  | ${passed}  |
            | ❌ Failed  | ${failed}  |
            | 🔴 Broken  | ${broken}  |
            | ⏭️ Skipped | ${skipped} |
            | **Total**  | **${total}** |

            **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Allure Report:** Download from the workflow Artifacts.
            **JIRA:** [QA-3303](https://joveojira.atlassian.net/browse/QA-3303)

            > Triggered by \`${{ github.event_name }}\` on \`${{ github.ref_name }}\``;

            // Update existing comment if one exists, otherwise create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('MOJO Pro QA')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
